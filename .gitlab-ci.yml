include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
    - when: never

stages:
  - lint_test
  - test
  - security_scan
  - security_postprocess
  - build_scan
  - terraform_plan
  - terraform_apply

default:
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29
  services:
    - name: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29-dind
      alias: docker
  tags:
    - 4cpu-16gb

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  DOCKER_TLS_CERTDIR: '/certs'
  TF_ROOT: 'packages/infra'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # GitLab SAST templates default to `test`; pin to our security scan stage.
  SAST_STAGE: 'security_scan'
  # Keep secret-detection template jobs in the same scan stage model.
  SECRET_DETECTION_STAGE: 'security_scan'
  # SAST: run on MR pipelines (GitLab ≥18). Skips duplicate branch scan when MR is open.
  AST_ENABLE_MR_PIPELINES: 'true'
  # SAST (semgrep): TS/JS. KICS (SAST-IaC): Scaleway Terraform in packages/infra only (no K8s/Dockerfile).
  SAST_EXCLUDED_PATHS: 'spec,test,tests,tmp,.ai,.agents,dist,.next,storybook-static,node_modules'
  # Kubesec (main SAST template) — we deploy Scaleway serverless containers, not Kubernetes.
  SCAN_KUBERNETES_MANIFESTS: 'false'
  # Secret detection: scan infra — tfvars, backend config, and .tf must not carry real keys.
  SECRET_DETECTION_EXCLUDED_PATHS: 'spec,test,tests,tmp,.ai,.agents,dist,.next,storybook-static,node_modules'
  # Trivy container scanning (https://trivy.dev/docs/latest/tutorials/integrations/gitlab-ci/)
  TRIVY_VERSION: '0.72.0'
  TRIVY_NO_PROGRESS: 'true'
  TRIVY_CACHE_DIR: '.trivycache/'
  # Trivy issue filing noise control:
  # false (default): create issues only when a fix is available ("Upgrade ...")
  # true: also create issues with no known fix yet.
  TRIVY_INCLUDE_UNFIXED: 'false'

sast:
  stage: security_scan

# ─── TEST ─────────────────────────────────────────────────────────────────────

# Merge gates: MR pipelines targeting main/production only. Post-merge main pipelines
# run quality:check-migrations + deploy; re-running lint/tests/SAST on main is redundant once
# "Pipelines must succeed" is enforced on the MR.
.mr-to-main-or-production:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production")'

# AI pipeline structural quality gate. Required MR check on protected `main`
# (Settings → Merge requests → "Pipelines must succeed"). See .ai/PIPELINE.md.
'quality:lint-and-types':
  extends: .mr-to-main-or-production
  stage: lint_test
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/oven/bun:1
  needs: []
  before_script:
    - bun install --frozen-lockfile
  script:
    - bun run lint
    - bun run check-types

# AI pipeline gate-script self-test: the structural guards must stay green.
'quality:ai-gate-tests':
  extends: .mr-to-main-or-production
  stage: lint_test
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/oven/bun:1
  needs: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git jq curl ca-certificates >/dev/null
    - update-ca-certificates >/dev/null 2>&1 || true
  script:
    - bash .ai/scripts/__tests__/gates.test.sh

# AI pipeline commit-convention gate: every MR commit subject must be
# `type(scope): description` (see .ai/PIPELINE.md Commit Convention). Structural backing
# for the otherwise prose-only convention. POSIX sh (GitLab default shell).
'quality:commit-lint':
  stage: lint_test
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/oven/bun:1
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git >/dev/null
  script:
    - |
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then echo "no MR base sha; skipping"; exit 0; fi
      bash .ai/scripts/commit-lint.sh range "${BASE}..HEAD"

# Runs on every pipeline (MR, main/production deploy, feature-branch builds).
'quality:check-migrations':
  stage: lint_test
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/oven/bun:1
  needs: []
  before_script:
    - bun install --frozen-lockfile
  script:
    # drizzle-kit generate diffs the schema against committed migration
    # snapshots. Redirecting stdin from /dev/null makes any interactive
    # rename prompt fail instead of hanging. We capture the output and only
    # pass when drizzle reports there is nothing to migrate.
    - |
      set -o pipefail
      OUTPUT="$(bun run --cwd apps/backend db:generate < /dev/null 2>&1 | tee /dev/stderr)"
      if ! echo "$OUTPUT" | grep -q "No schema changes, nothing to migrate"; then
        echo "✖ Schema changes are not reflected in committed migrations."
        echo "  Run 'bun run --cwd apps/backend db:generate' locally and commit the result."
        exit 1
      fi

'quality:integration-tests':
  extends: .mr-to-main-or-production
  stage: lint_test
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/oven/bun:1
  needs: []
  services:
    - name: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: clippy_test
    POSTGRES_USER: clippy
    POSTGRES_PASSWORD: clippy
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: clippy
    DB_PASSWORD: clippy
    DB_NAME: clippy_test
  before_script:
    - bun install --frozen-lockfile
    - bun run build
    - until bunx --yes wait-on tcp:postgres:5432; do echo "waiting for postgres..."; sleep 1; done
    - bun run --cwd apps/backend db:migrate
    - bun run --cwd apps/backend db:seed
  script:
    - bun test

# ─── SAST ─────────────────────────────────────────────────────────────────────
# semgrep-sast (template) scans TS/JS; kics-iac-sast scans Scaleway Terraform (packages/infra).
# kics.config limits KICS to Terraform only — no Kubernetes manifests or Dockerfiles.
# sast:merge-reports combines gl-sast-report.json + gl-sast-report-iac.json.
# sast:summary posts Critical/High table (job log + MR comment); sast:gate blocks merge;
# sast:medium-issues files Medium findings as grouped GitLab issues (one per file+rule). Both need SAST_ISSUES_TOKEN.

semgrep-sast:
  stage: security_scan
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production")'

kics-iac-sast:
  stage: security_scan
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production")'
  after_script:
    - |
      if [ -f gl-sast-report.json ]; then
        mv gl-sast-report.json gl-sast-report-iac.json
      fi
  artifacts:
    access: 'developer'
    reports:
      sast: gl-sast-report-iac.json
    paths:
      - gl-sast-report-iac.json

'sast:merge-reports':
  extends: .mr-to-main-or-production
  stage: security_postprocess
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/alpine:3
  tags:
    - 4cpu-16gb
  before_script:
    - apk add --no-cache bash jq
  needs:
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: kics-iac-sast
      artifacts: true
      optional: true
  script:
    - bash .ai/scripts/sast-merge-reports.sh gl-sast-report.json gl-sast-report.json gl-sast-report-iac.json
  artifacts:
    paths:
      - gl-sast-report.json

.sast-postprocess:
  extends: .mr-to-main-or-production
  stage: security_postprocess
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/alpine:3
  tags:
    - 4cpu-16gb
  before_script:
    - apk add --no-cache bash jq curl
  needs:
    - job: 'sast:merge-reports'
      artifacts: true
      optional: true

'sast:summary':
  extends: .sast-postprocess
  allow_failure: true
  script:
    - bash .ai/scripts/sast-mr-comment.sh gl-sast-report.json

'sast:gate':
  extends: .sast-postprocess
  script:
    - bash .ai/scripts/sast-gate.sh gl-sast-report.json

'sast:medium-issues':
  extends: .sast-postprocess
  allow_failure: true
  script:
    - bash .ai/scripts/sast-open-medium-issues.sh gl-sast-report.json

'sast:close-fixed-issues':
  extends: .sast-postprocess
  allow_failure: true
  needs:
    - job: 'sast:merge-reports'
      artifacts: true
      optional: true
  script:
    - bash .ai/scripts/sast-close-fixed-medium-issues.sh gl-sast-report.json

# ─── SECRET DETECTION ─────────────────────────────────────────────────────────
# secret_detection (template) scans the repo and uploads gl-secret-detection-report.json.
# secret:detection-gate blocks merge on any finding.

secret_detection:
  stage: security_scan
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production")'

.secret-postprocess:
  extends: .mr-to-main-or-production
  stage: security_postprocess
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/alpine:3
  tags:
    - 4cpu-16gb
  before_script:
    - apk add --no-cache bash jq
  needs:
    - job: secret_detection
      artifacts: true
      optional: true

'secret:detection-gate':
  extends: .secret-postprocess
  script:
    - bash .ai/scripts/secret-gate.sh gl-secret-detection-report.json

# ─── CONTAINER SCANNING (TRIVY) ───────────────────────────────────────────────
# Branch builds scan local images; staging/production scan the Scaleway registry.
# trivy:merge-reports combines per-image reports; trivy:summary posts Critical/High
# table (job log + MR comment); trivy:issues files Critical/High as GitLab work items (non-blocking).

.trivy-scan-registry:
  stage: build_scan
  image:
    name: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/aquasec/trivy:0.72.0
    entrypoint: ['']
  variables:
    GIT_DEPTH: 1
    TRIVY_USERNAME: nologin
    TRIVY_PASSWORD: $SCW_SECRET_KEY
  before_script:
    - trivy --version
    - trivy image --download-db-only
  script:
    - sh .ai/scripts/trivy-gitlab-report.sh "$TRIVY_IMAGE_REF" "$TRIVY_REPORT_PATH"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$TRIVY_IMAGE_REF"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  artifacts:
    when: always
    paths:
      - $TRIVY_REPORT_PATH

.trivy-postprocess:
  extends: .mr-to-main-or-production
  stage: build_scan
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/alpine:3
  tags:
    - 4cpu-16gb
  before_script:
    - apk add --no-cache bash jq curl
  needs:
    - job: 'build:backend-branch'
      artifacts: true
      optional: true
    - job: 'build:frontend-branch'
      artifacts: true
      optional: true

'trivy:merge-reports':
  extends: .trivy-postprocess
  script:
    - bash .ai/scripts/trivy-merge-reports.sh gl-container-scanning-report.json gl-container-scanning-report-backend.json gl-container-scanning-report-frontend.json
  artifacts:
    when: always
    paths:
      - gl-container-scanning-report.json
    reports:
      container_scanning: gl-container-scanning-report.json

'trivy:issues':
  extends: .trivy-postprocess
  allow_failure: true
  needs:
    - job: 'trivy:merge-reports'
      artifacts: true
      optional: true
  script:
    - bash .ai/scripts/trivy-open-issues.sh gl-container-scanning-report.json

'trivy:close-fixed-issues':
  extends: .trivy-postprocess
  allow_failure: true
  needs:
    - job: 'trivy:merge-reports'
      artifacts: true
      optional: true
  script:
    - bash .ai/scripts/trivy-close-fixed-issues.sh gl-container-scanning-report.json

'trivy:summary':
  extends: .trivy-postprocess
  allow_failure: true
  needs:
    - job: 'trivy:merge-reports'
      artifacts: true
      optional: true
  script:
    - bash .ai/scripts/trivy-mr-comment.sh gl-container-scanning-report.json

'trivy:scan-staging-backend':
  extends: .trivy-scan-registry
  needs: ["build:staging-backend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    TRIVY_IMAGE_REF: '$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE/clippy-backend:$CI_COMMIT_SHORT_SHA'
    TRIVY_REPORT_PATH: gl-container-scanning-report-staging-backend.json
  allow_failure: true

'trivy:scan-staging-frontend':
  extends: .trivy-scan-registry
  needs: ["build:staging-frontend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    TRIVY_IMAGE_REF: '$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE/clippy-frontend:$CI_COMMIT_SHORT_SHA'
    TRIVY_REPORT_PATH: gl-container-scanning-report-staging-frontend.json
  allow_failure: true

'trivy:scan-production-backend':
  extends: .trivy-scan-registry
  needs: ["build:production-backend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  variables:
    TRIVY_IMAGE_REF: '$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE/clippy-backend:$CI_COMMIT_SHORT_SHA'
    TRIVY_REPORT_PATH: gl-container-scanning-report-production-backend.json
  allow_failure: true

'trivy:scan-production-frontend':
  extends: .trivy-scan-registry
  needs: ["build:production-frontend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  variables:
    TRIVY_IMAGE_REF: '$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE/clippy-frontend:$CI_COMMIT_SHORT_SHA'
    TRIVY_REPORT_PATH: gl-container-scanning-report-production-frontend.json
  allow_failure: true

# ─── BUILD ────────────────────────────────────────────────────────────────────

.build-images-base:
  stage: build_scan
  # Deploy-path image builds (main/production) should wait for migration-sync
  # validation before producing/pushing deployment artifacts.
  needs:
    - job: 'quality:check-migrations'
      optional: true
  before_script:
    - echo "Logging into Scaleway registry"
    - unset DOCKER_AUTH_CONFIG
    - echo "$SCW_SECRET_KEY" | docker login "$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE" -u "nologin" --password-stdin
    - export REGISTRY_NAMESPACE="$SCW_REGISTRY_HOST/$SCW_REGISTRY_NAMESPACE"
    - export IMAGE_TAG_SHA="$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export STABLE_TAG="staging"
        export NEXT_PUBLIC_API_URL="https://staging.clippy.apis.holi.social"
        export NEXT_PUBLIC_WEB_URL="https://staging.clippy.holi.social"
      elif [ "$CI_COMMIT_BRANCH" = "production" ]; then
        export STABLE_TAG="latest"
        export NEXT_PUBLIC_API_URL="https://clippy.apis.holi.social"
        export NEXT_PUBLIC_WEB_URL="https://clippy.holi.social"
      else
        echo "Unsupported branch $CI_COMMIT_BRANCH"; exit 1
      fi

.build-images-backend:
  extends: .build-images-base
  script:
    - export BACKEND_IMAGE_NAME="clippy-backend"
    - docker buildx build --load
      -t "$REGISTRY_NAMESPACE/$BACKEND_IMAGE_NAME:$IMAGE_TAG_SHA"
      -t "$REGISTRY_NAMESPACE/$BACKEND_IMAGE_NAME:$STABLE_TAG"
      -f apps/backend/Dockerfile .
    - docker push "$REGISTRY_NAMESPACE/$BACKEND_IMAGE_NAME:$IMAGE_TAG_SHA"
    - docker push "$REGISTRY_NAMESPACE/$BACKEND_IMAGE_NAME:$STABLE_TAG"

.build-images-frontend:
  extends: .build-images-base
  script:
    - export FRONTEND_IMAGE_NAME="clippy-frontend"
    - docker buildx build --load
      --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
      --build-arg NEXT_PUBLIC_WEB_URL="$NEXT_PUBLIC_WEB_URL"
      -t "$REGISTRY_NAMESPACE/$FRONTEND_IMAGE_NAME:$IMAGE_TAG_SHA"
      -t "$REGISTRY_NAMESPACE/$FRONTEND_IMAGE_NAME:$STABLE_TAG"
      -f apps/frontend/Dockerfile .
    - docker push "$REGISTRY_NAMESPACE/$FRONTEND_IMAGE_NAME:$IMAGE_TAG_SHA"
    - docker push "$REGISTRY_NAMESPACE/$FRONTEND_IMAGE_NAME:$STABLE_TAG"

.build-images-base-branch:
  stage: build_scan
  # Branch/MR builds are scan inputs; they do not consume quality artifacts.
  # Start immediately to reduce security feedback latency.
  needs: []
  before_script:
    - echo "Building Docker images for branch (no push)"
    - apk add --no-cache bash curl
    - unset DOCKER_AUTH_CONFIG
    - export IMAGE_TAG_SHA="$CI_COMMIT_SHORT_SHA"

.build-images-backend-branch:
  extends: .build-images-base-branch
  script:
    - export BACKEND_IMAGE_NAME="clippy-backend"
    - docker buildx build --load
      -t "$BACKEND_IMAGE_NAME:$IMAGE_TAG_SHA"
      -f apps/backend/Dockerfile .
    - export TRIVY_IMAGE_REF="$BACKEND_IMAGE_NAME:$IMAGE_TAG_SHA"
    - export TRIVY_REPORT_PATH="gl-container-scanning-report-backend.json"
    - sh .ai/scripts/trivy-scan-image.sh "$TRIVY_IMAGE_REF" "$TRIVY_REPORT_PATH"
  artifacts:
    when: always
    paths:
      - gl-container-scanning-report-backend.json
    expire_in: 1 day
  cache:
    key: trivy-db
    paths:
      - .trivycache/

.build-images-frontend-branch:
  extends: .build-images-base-branch
  script:
    - export FRONTEND_IMAGE_NAME="clippy-frontend"
    - docker buildx build --load
      --build-arg NEXT_PUBLIC_API_URL="http://localhost"
      --build-arg NEXT_PUBLIC_WEB_URL="http://localhost"
      -t "$FRONTEND_IMAGE_NAME:$IMAGE_TAG_SHA"
      -f apps/frontend/Dockerfile .
    - export TRIVY_IMAGE_REF="$FRONTEND_IMAGE_NAME:$IMAGE_TAG_SHA"
    - export TRIVY_REPORT_PATH="gl-container-scanning-report-frontend.json"
    - sh .ai/scripts/trivy-scan-image.sh "$TRIVY_IMAGE_REF" "$TRIVY_REPORT_PATH"
  artifacts:
    when: always
    paths:
      - gl-container-scanning-report-frontend.json
    expire_in: 1 day
  cache:
    key: trivy-db
    paths:
      - .trivycache/

'build:staging-backend':
  extends: .build-images-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

'build:staging-frontend':
  extends: .build-images-frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

'build:production-backend':
  extends: .build-images-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'

'build:production-frontend':
  extends: .build-images-frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'

'build:backend-branch':
  extends: .build-images-backend-branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "production"'

'build:frontend-branch':
  extends: .build-images-frontend-branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "production"'

.terraform:
  image:
    name: hashicorp/terraform:1.15
    entrypoint: ['']
  before_script:
    - cd "$TF_ROOT"
    - terraform --version
    - test -n "$TF_VAR_active_environment"
    - terraform init -backend-config="key=${TF_VAR_active_environment}/terraform.tfstate"

# ─── STAGING PLAN ─────────────────────────────────────────────────────────────

'terraform:staging-plan-mr':
  extends: .terraform
  stage: terraform_plan
  # MR plan is advisory feedback and does not require build/test artifacts.
  needs: []
  resource_group: 'terraform-staging'
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    TF_VAR_image_tag: '$CI_COMMIT_SHORT_SHA'
    TF_VAR_active_environment: 'staging'
  script:
    - terraform validate
    - terraform plan -var-file="terraform.tfvars"

'terraform:staging-plan':
  extends: .terraform
  stage: terraform_plan
  retry: 2
  needs: ['build:staging-backend', 'build:staging-frontend']
  resource_group: 'terraform-staging'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    TF_VAR_image_tag: '$CI_COMMIT_SHORT_SHA'
    TF_VAR_active_environment: 'staging'
  script:
    - terraform validate
    - |
      set +e
      terraform plan \
        -detailed-exitcode \
        -var-file="terraform.tfvars" \
        -out="plan-staging.tfplan"
      PLAN_EXIT_CODE=$?
      if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
        echo "TF_HAS_CHANGES_STAGING=0" > tfplan-staging.env
      elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
        echo "TF_HAS_CHANGES_STAGING=1" > tfplan-staging.env
      else
        exit "$PLAN_EXIT_CODE"
      fi
      set -e
  artifacts:
    reports:
      dotenv: packages/infra/tfplan-staging.env
    paths:
      - packages/infra/plan-staging.tfplan

'terraform:staging-apply':
  extends: .terraform
  stage: terraform_apply
  needs: ["terraform:staging-plan"]
  variables:
    TF_VAR_active_environment: 'staging'
  resource_group: 'terraform-staging'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  environment:
    name: staging
  script:
    - |
      if [ "${TF_HAS_CHANGES_STAGING:-1}" != "1" ]; then
        echo "No Terraform changes detected for staging, skipping apply."
        exit 0
      fi
      terraform apply -auto-approve "plan-staging.tfplan"
  allow_failure: false

# ─── PRODUCTION PLAN ──────────────────────────────────────────────────────────

'terraform:production-plan-mr':
  extends: .terraform
  stage: terraform_plan
  # MR plan is advisory feedback and does not require build/test artifacts.
  needs: []
  resource_group: 'terraform-production'
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production" && $CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    TF_VAR_image_tag: '$CI_COMMIT_SHORT_SHA'
    TF_VAR_active_environment: 'production'
  script:
    - terraform validate
    - terraform plan -var-file="terraform.tfvars"

'terraform:production-plan':
  extends: .terraform
  stage: terraform_plan
  retry: 2
  needs: ['build:production-backend', 'build:production-frontend']
  resource_group: 'terraform-production'
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  variables:
    TF_VAR_image_tag: '$CI_COMMIT_SHORT_SHA'
    TF_VAR_active_environment: 'production'
  script:
    - terraform validate
    - |
      set +e
      terraform plan \
        -detailed-exitcode \
        -var-file="terraform.tfvars" \
        -out="plan-production.tfplan"
      PLAN_EXIT_CODE=$?
      if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
        echo "TF_HAS_CHANGES_PRODUCTION=0" > tfplan-production.env
      elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
        echo "TF_HAS_CHANGES_PRODUCTION=1" > tfplan-production.env
      else
        exit "$PLAN_EXIT_CODE"
      fi
      set -e
  artifacts:
    reports:
      dotenv: packages/infra/tfplan-production.env
    paths:
      - packages/infra/plan-production.tfplan

'terraform:production-apply':
  extends: .terraform
  stage: terraform_apply
  needs: ["terraform:production-plan"]
  variables:
    TF_VAR_active_environment: 'production'
  resource_group: 'terraform-production'
  rules:
    - if: '$CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
  environment:
    name: production
  script:
    - |
      if [ "${TF_HAS_CHANGES_PRODUCTION:-1}" != "1" ]; then
        echo "No Terraform changes detected for production, skipping apply."
        exit 0
      fi
      terraform apply -auto-approve "plan-production.tfplan"
  allow_failure: false
