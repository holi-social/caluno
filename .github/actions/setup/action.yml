name: Setup workspace
description: >-
  Install the Bun version pinned in package.json, restore the Bun and Turborepo
  caches, and install workspace dependencies. Run actions/checkout first.

inputs:
  install:
    description: Run `bun install --frozen-lockfile`.
    required: false
    default: 'true'
  turbo-cache:
    description: Restore and save the Turborepo filesystem cache (.turbo/cache).
    required: false
    default: 'false'
  cache-key:
    description: Turborepo cache key scope, so unrelated jobs keep separate entries.
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json # the `packageManager` field

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Restore Turborepo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        # The sha never hits, so the cache saves every run; restore-keys warm it.
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
