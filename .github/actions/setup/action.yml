name: Setup workspace
description: >-
  Install the Bun version pinned in package.json, restore the Bun and Turborepo
  caches, and install workspace dependencies. Run actions/checkout first.
  Pair `turbo-cache: true` with the save-turbo-cache action at the end of the job.

inputs:
  install:
    description: Run `bun install --frozen-lockfile`.
    required: false
    default: 'true'
  turbo-cache:
    description: Restore the Turborepo filesystem cache (.turbo/cache).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json # the `packageManager` field

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # Restore only; save-turbo-cache handles the other half.
    - name: Restore Turborepo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        # One scope for every job — entries are content-addressed by task hash.
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
