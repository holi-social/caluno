name: Setup workspace
description: >-
  Install the Bun version pinned in package.json, restore the Bun install and
  Turborepo caches, and install workspace dependencies. Assumes actions/checkout
  has already run (local actions are only resolvable after checkout).

inputs:
  install:
    description: Run `bun install --frozen-lockfile`.
    required: false
    default: 'true'
  turbo-cache:
    description: >-
      Restore and save the Turborepo filesystem cache (.turbo/cache). Only worth
      enabling for jobs that run `turbo` tasks with real outputs (build,
      check-types) — not for a bare Biome pass.
    required: false
    default: 'false'
  cache-key:
    description: >-
      Extra Turborepo cache key component so unrelated jobs do not overwrite each
      other's entry.
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # Single source of truth: the `packageManager` field in package.json.
        bun-version-file: package.json

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        # Without restore-keys, any lockfile change means a cold install.
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Restore Turborepo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        # The sha in the primary key never hits, which is what makes the cache
        # save on every run; restore-keys supply the actual warm start.
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
