name: Docker auth
description: >-
  Set up a buildx builder and log into both registries the image builds need:
  Scaleway (push + layer cache) and GHCR (the base-image mirror).

inputs:
  scw-registry-host:
    description: Scaleway registry host, e.g. rg.fr-par.scw.cloud (host only, no namespace).
    required: true
  scw-secret-key:
    description: Scaleway secret key, used as the registry password.
    required: true
  github-token:
    description: "Token for ghcr.io — the job's GITHUB_TOKEN, which needs `packages: read`."
    required: true

runs:
  using: composite
  steps:
    # The default `docker` driver cannot import/export registry caches.
    - uses: docker/setup-buildx-action@v3

    - name: Log in to the Scaleway registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.scw-registry-host }}
        username: nologin
        password: ${{ inputs.scw-secret-key }}

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
