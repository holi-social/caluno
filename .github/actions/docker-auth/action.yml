name: Docker auth
description: >-
  Set up a buildx builder and authenticate against both registries the image
  builds need: the Scaleway registry (image push + shared layer cache) and GHCR
  (the ghcr.io/holi-social base-image mirror the Dockerfiles pull FROM).

inputs:
  scw-registry-host:
    description: Scaleway registry host, e.g. rg.fr-par.scw.cloud (host only, no namespace).
    required: true
  scw-secret-key:
    description: Scaleway secret key, used as the registry password.
    required: true
  github-token:
    description: "Token for ghcr.io — the job's GITHUB_TOKEN, which needs `packages: read`."
    required: true

runs:
  using: composite
  steps:
    # GitHub-hosted runners default to the `docker` buildx driver, which cannot
    # import or export registry/gha caches at all. The container driver can.
    - uses: docker/setup-buildx-action@v3

    - name: Log in to the Scaleway registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.scw-registry-host }}
        username: nologin
        password: ${{ inputs.scw-secret-key }}

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
