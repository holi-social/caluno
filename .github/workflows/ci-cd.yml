# See SETUP.md at the repo root for the one-time setup this workflow
# depends on (secrets, runners, environment protection rules).
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, production]

env:
  TF_ROOT: packages/infra
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  # ─── TEST ───────────────────────────────────────────────────────────────────

  lint-and-types:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types

  ai-gate-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - run: bash .ai/scripts/__tests__/gates.test.sh

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
          fetch-depth: 0
      - run: bash .ai/scripts/commit-lint.sh range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
      - name: Check migrations are up to date
        run: |
          set -o pipefail
          OUTPUT="$(bun run --cwd apps/backend db:generate < /dev/null 2>&1 | tee /dev/stderr)"
          if ! echo "$OUTPUT" | grep -q "No schema changes, nothing to migrate"; then
            echo "✖ Schema changes are not reflected in committed migrations."
            echo "  Run 'bun run --cwd apps/backend db:generate' locally and commit the result."
            exit 1
          fi

  integration-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/holi-social/mirror/postgres:17
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: caluno_test
          POSTGRES_USER: caluno
          POSTGRES_PASSWORD: caluno
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: caluno
      DB_PASSWORD: caluno
      DB_NAME: caluno_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd apps/backend db:migrate
      - run: bun run --cwd apps/backend db:seed
      - run: bun test

  # ─── BUILD ──────────────────────────────────────────────────────────────────

  build-staging-backend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            -t "$REGISTRY_NAMESPACE/caluno-backend:$IMAGE_TAG_SHA" \
            -t "$REGISTRY_NAMESPACE/caluno-backend:staging" \
            -f apps/backend/Dockerfile .
          docker push "$REGISTRY_NAMESPACE/caluno-backend:$IMAGE_TAG_SHA"
          docker push "$REGISTRY_NAMESPACE/caluno-backend:staging"

  build-staging-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            --build-arg NEXT_PUBLIC_API_URL="https://staging.api.caluno.org" \
            --build-arg NEXT_PUBLIC_WEB_URL="https://staging.app.caluno.org" \
            -t "$REGISTRY_NAMESPACE/caluno-frontend:$IMAGE_TAG_SHA" \
            -t "$REGISTRY_NAMESPACE/caluno-frontend:staging" \
            -f apps/frontend/Dockerfile .
          docker push "$REGISTRY_NAMESPACE/caluno-frontend:$IMAGE_TAG_SHA"
          docker push "$REGISTRY_NAMESPACE/caluno-frontend:staging"

  build-production-backend:
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [check-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            -t "$REGISTRY_NAMESPACE/caluno-backend:$IMAGE_TAG_SHA" \
            -t "$REGISTRY_NAMESPACE/caluno-backend:latest" \
            -f apps/backend/Dockerfile .
          docker push "$REGISTRY_NAMESPACE/caluno-backend:$IMAGE_TAG_SHA"
          docker push "$REGISTRY_NAMESPACE/caluno-backend:latest"

  build-production-frontend:
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [check-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            --build-arg NEXT_PUBLIC_API_URL="https://api.caluno.org" \
            --build-arg NEXT_PUBLIC_WEB_URL="https://app.caluno.org" \
            -t "$REGISTRY_NAMESPACE/caluno-frontend:$IMAGE_TAG_SHA" \
            -t "$REGISTRY_NAMESPACE/caluno-frontend:latest" \
            -f apps/frontend/Dockerfile .
          docker push "$REGISTRY_NAMESPACE/caluno-frontend:$IMAGE_TAG_SHA"
          docker push "$REGISTRY_NAMESPACE/caluno-frontend:latest"

  build-backend-branch:
    if: |
      github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image (no push)
        env:
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            -t "caluno-backend:$IMAGE_TAG_SHA" \
            -f apps/backend/Dockerfile .

  build-frontend-branch:
    if: |
      github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image (no push)
        env:
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            --build-arg NEXT_PUBLIC_API_URL="http://localhost" \
            --build-arg NEXT_PUBLIC_WEB_URL="http://localhost" \
            -t "caluno-frontend:$IMAGE_TAG_SHA" \
            -f apps/frontend/Dockerfile .

  # ─── DEPLOY: STAGING ────────────────────────────────────────────────────────

  terraform-staging-plan-mr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-staging
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_active_environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=staging/terraform.tfstate"
          terraform validate
          terraform plan -var-file="terraform.tfvars"

  terraform-staging-plan:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-staging-backend, build-staging-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-staging
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_active_environment: staging
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=staging/terraform.tfstate"
          terraform validate
          set +e
          terraform plan -detailed-exitcode -var-file="terraform.tfvars" -out=plan-staging.tfplan
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "has_changes=0" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then echo "has_changes=1" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan-staging
          path: packages/infra/plan-staging.tfplan
          retention-days: 1

  terraform-staging-apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [terraform-staging-plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-staging
    environment: staging
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_active_environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-staging
          path: ${{ env.TF_ROOT }}
      - working-directory: ${{ env.TF_ROOT }}
        run: |
          if [ "${{ needs.terraform-staging-plan.outputs.has_changes }}" != "1" ]; then
            echo "No Terraform changes detected for staging, skipping apply."
            exit 0
          fi
          terraform init -backend-config="key=staging/terraform.tfstate"
          terraform apply -auto-approve "plan-staging.tfplan"

  # ─── DEPLOY: PRODUCTION ─────────────────────────────────────────────────────

  terraform-production-plan-mr:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-production
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_active_environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=production/terraform.tfstate"
          terraform validate
          terraform plan -var-file="terraform.tfvars"

  terraform-production-plan:
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [build-production-backend, build-production-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-production
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_active_environment: production
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=production/terraform.tfstate"
          terraform validate
          set +e
          terraform plan -detailed-exitcode -var-file="terraform.tfvars" -out=plan-production.tfplan
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "has_changes=0" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then echo "has_changes=1" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan-production
          path: packages/infra/plan-production.tfplan
          retention-days: 1

  # Production applies should require human approval: configure a
  # "required reviewers" protection rule on the `production` environment
  # (repo Settings → Environments → production). Until that's configured,
  # this job runs automatically on every push to `production`.
  terraform-production-apply:
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [terraform-production-plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: terraform-production
    environment: production
    container:
      image: ghcr.io/holi-social/mirror/terraform:1.15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TF_VAR_active_environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-production
          path: ${{ env.TF_ROOT }}
      - working-directory: ${{ env.TF_ROOT }}
        run: |
          if [ "${{ needs.terraform-production-plan.outputs.has_changes }}" != "1" ]; then
            echo "No Terraform changes detected for production, skipping apply."
            exit 0
          fi
          terraform init -backend-config="key=production/terraform.tfstate"
          terraform apply -auto-approve "plan-production.tfplan"
