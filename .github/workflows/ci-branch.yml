# See SETUP.md at the repo root for the one-time setup this workflow
# depends on (secrets, runners, environment protection rules).
name: CI - Branch

on:
  push:
    branches-ignore: [main, production]

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
      - name: Check migrations are up to date
        run: |
          set -o pipefail
          OUTPUT="$(bun run --cwd apps/backend db:generate < /dev/null 2>&1 | tee /dev/stderr)"
          if ! echo "$OUTPUT" | grep -q "No schema changes, nothing to migrate"; then
            echo "✖ Schema changes are not reflected in committed migrations."
            echo "  Run 'bun run --cwd apps/backend db:generate' locally and commit the result."
            exit 1
          fi

  build-backend-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image (no push)
        env:
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            -t "caluno-backend:$IMAGE_TAG_SHA" \
            -f apps/backend/Dockerfile .

  build-frontend-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image (no push)
        env:
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load \
            --build-arg NEXT_PUBLIC_API_URL="http://localhost" \
            --build-arg NEXT_PUBLIC_WEB_URL="http://localhost" \
            -t "caluno-frontend:$IMAGE_TAG_SHA" \
            -f apps/frontend/Dockerfile .
