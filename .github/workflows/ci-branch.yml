# See SETUP.md at the repo root for the one-time setup this workflow
# depends on (secrets, runners, environment protection rules).
name: CI - Branch

on:
  push:
    branches-ignore: [main, production]

jobs:
  check-pr:
    runs-on: light-runners
    permissions:
      pull-requests: read
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for an open PR on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${{ github.ref_name }}" \
            | jq 'length')"
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          fi

  check-migrations:
    needs: check-pr
    if: needs.check-pr.outputs.has_pr == 'false'
    runs-on: light-runners
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Check migrations are up to date
        run: |
          set -o pipefail
          OUTPUT="$(bun run --cwd apps/backend db:generate < /dev/null 2>&1 | tee /dev/stderr)"
          if ! echo "$OUTPUT" | grep -q "No schema changes, nothing to migrate"; then
            echo "✖ Schema changes are not reflected in committed migrations."
            echo "  Run 'bun run --cwd apps/backend db:generate' locally and commit the result."
            exit 1
          fi

  build-backend-branch:
    needs: check-pr
    if: needs.check-pr.outputs.has_pr == 'false'
    runs-on: build-runners
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image (no push, no local image kept)
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
        run: |
          docker buildx build --output type=cacheonly \
            --cache-from "type=registry,ref=$REGISTRY_NAMESPACE/caluno-backend:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY_NAMESPACE/caluno-backend:buildcache,mode=max" \
            -f apps/backend/Dockerfile .

  build-frontend-branch:
    needs: check-pr
    if: needs.check-pr.outputs.has_pr == 'false'
    runs-on: build-runners
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_PAT }}
      - name: Log into Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}" -u nologin --password-stdin
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image (no push, no local image kept)
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}
        run: |
          docker buildx build --output type=cacheonly \
            --cache-from "type=registry,ref=$REGISTRY_NAMESPACE/caluno-frontend:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY_NAMESPACE/caluno-frontend:buildcache,mode=max" \
            --build-arg NEXT_PUBLIC_API_URL="http://localhost" \
            --build-arg NEXT_PUBLIC_WEB_URL="http://localhost" \
            -f apps/frontend/Dockerfile .
