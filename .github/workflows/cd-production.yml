# Deploys `production`. The apply waits on the `production` environment's
# required reviewers. See SETUP.md for the one-time setup.
name: CD · Production

on:
  push:
    branches: [production]

# One deploy at a time, never cancelled mid-apply.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Pre-deploy gate
    # A called workflow gets at most what the calling job grants.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      static-checks: false # already required on the pull request
    secrets: inherit

  deploy:
    name: Deploy
    needs: [gate]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      moving-tag: latest
      api-url: https://api.caluno.org
      web-url: https://app.caluno.org
    secrets: inherit
