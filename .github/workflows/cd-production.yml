# See SETUP.md at the repo root for the one-time setup this workflow depends on
# (secrets, variables, environments, branch protection).
#
# `production` is protected: it only ever advances through a main → production
# pull request, which ran the full CI suite. Same slim gate as staging; the extra
# safety here comes from the `production` GitHub Environment, whose required
# reviewers hold the Terraform apply until a human approves it.
name: CD · Production

on:
  push:
    branches: [production]

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Pre-deploy gate
    # A called workflow can never hold more than the calling job grants; the
    # test job pulls Postgres from the GHCR mirror.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      static-checks: false # already required on the pull request
    secrets: inherit

  deploy:
    name: Deploy
    needs: [gate]
    # Base images come from the GHCR mirror.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      moving-tag: latest
      api-url: https://api.caluno.org
      web-url: https://app.caluno.org
    secrets: inherit
