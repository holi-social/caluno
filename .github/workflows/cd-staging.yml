# Deploys `main` to staging. See SETUP.md for the one-time setup.
name: CD · Staging

on:
  push:
    branches: [main]

# One deploy at a time, never cancelled mid-apply.
concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Pre-deploy gate
    # A called workflow gets at most what the calling job grants.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      static-checks: false # already required on the pull request
    secrets: inherit

  deploy:
    name: Deploy
    needs: [gate]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      moving-tag: staging
      api-url: https://staging.api.caluno.org
      web-url: https://staging.app.caluno.org
    secrets: inherit
