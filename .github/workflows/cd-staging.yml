# See SETUP.md at the repo root for the one-time setup this workflow depends on
# (secrets, variables, environments, branch protection).
#
# `main` is protected: every commit here already passed the full CI suite as a
# required check on its pull request. So this workflow runs the *slim* gate only
# — migrations + tests, enough to catch a merge that broke against a base that
# moved — and skips lint/type-check, commit lint and the AI gates entirely.
name: CD · Staging

on:
  push:
    branches: [main]

# One staging deploy at a time, and never cancel one mid-flight: a half-applied
# Terraform run is much worse than a slightly stale queue.
concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Pre-deploy gate
    # A called workflow can never hold more than the calling job grants; the
    # test job pulls Postgres from the GHCR mirror.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      static-checks: false # already required on the pull request
    secrets: inherit

  deploy:
    name: Deploy
    needs: [gate]
    # Base images come from the GHCR mirror.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      moving-tag: staging
      api-url: https://staging.api.caluno.org
      web-url: https://staging.app.caluno.org
    secrets: inherit
