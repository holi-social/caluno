# See SETUP.md at the repo root for the one-time setup this workflow depends on
# (secrets, variables, environments, branch protection).
#
# `main` and `production` are protected branches: nothing lands on them except
# through a pull request, so this workflow is the real gate. It runs the full
# suite — including the checks that only make sense pre-merge (commit lint, AI
# gates, throwaway image builds, Terraform plan). The CD workflows deliberately
# do NOT repeat those.
#
# Branch protection should require exactly one check: `CI`. That job aggregates
# everything below, so path-filtered jobs can skip without blocking a merge.
name: CI

on:
  pull_request:
    branches: [main, production]

# One in-flight run per pull request; pushing a new commit cancels the old run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: 1.15.9
  TF_ROOT: packages/infra
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Treeless: full history for the merge-base, without every historical
          # blob. Only the checked-out tree's blobs are fetched.
          filter: blob:none
          persist-credentials: false
      - id: filter
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff against the merge base, not the base tip: the base branch may
          # have moved on since this PR branched.
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          files="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          matches() { echo "$files" | grep -qE "$1"; }

          # Anything that can change what either app compiles to.
          shared='^(package\.json|bun\.lock|turbo\.json|tsconfig\.json|biome\.json|bunfig\.toml)$|^packages/(data|ui|observability|typescript-config)/|^\.github/'

          # `frontend` only feeds `code` — both image builds are unconditional,
          # so nothing gates on it directly.
          backend=false; frontend=false; infra=false
          matches "^apps/backend/|^scripts/|$shared" && backend=true
          matches "^apps/frontend/|$shared" && frontend=true
          matches '^packages/infra|^\.github/workflows/' && infra=true

          code=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then code=true; fi

          {
            echo "code=$code"
            echo "backend=$backend"
            echo "infra=$infra"
          } | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: [changes]
    # A called workflow can never hold more than the calling job grants, so the
    # GHCR read the test job's Postgres service needs has to be granted here.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      # Biome and tsc always run: they cover the whole repo (including config
      # and JSON), and both are cache-warm in seconds. Only the jobs that need a
      # database or a full build are path-gated.
      static-checks: true
      migration-check: ${{ fromJSON(needs.changes.outputs.backend) }}
      tests: ${{ fromJSON(needs.changes.outputs.code) }}
    secrets: inherit

  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
          fetch-depth: 0
          filter: blob:none # commit messages only; no historical blobs needed
      # head.sha, not github.sha: on pull_request the latter is the synthetic
      # merge commit, which is not a commit anyone authored.
      - run: bash .ai/scripts/commit-lint.sh range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  ai-gates:
    name: AI gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - run: bash .ai/scripts/__tests__/gates.test.sh

  build-backend:
    name: Build backend image
    # Unconditional: the two apps share a build context (the frontend Dockerfile
    # COPYs `apps/` wholesale, and packages/data runs codegen off the backend's
    # schema.gql), so "which app did this diff touch" is not a question worth
    # answering here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # base images come from the ghcr.io/holi-social mirror
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: ./.github/actions/docker-auth
        with:
          scw-registry-host: ${{ vars.SCW_REGISTRY_HOST }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (validate only, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          # Match the deploy builds exactly — see the note there.
          provenance: false
          # Prove the image builds; keep nothing. Layers land in the Actions
          # cache so the next push on this PR is incremental.
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=backend
            type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-backend:buildcache
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: ./.github/actions/docker-auth
        with:
          scw-registry-host: ${{ vars.SCW_REGISTRY_HOST }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (validate only, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          # Match the deploy builds exactly — see the note there.
          provenance: false
          outputs: type=cacheonly
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost
            NEXT_PUBLIC_WEB_URL=http://localhost
          cache-from: |
            type=gha,scope=frontend
            type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-frontend:buildcache
          cache-to: type=gha,scope=frontend,mode=max

  terraform-plan:
    name: Terraform plan
    needs: [changes]
    # Only when infra actually changed: on a pull request the plan's image_tag
    # is this PR's sha, which will never be deployed, so an unconditional plan
    # is pure noise.
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A PR into `production` is a promotion; anything else targets staging.
      # (Job-level env entries cannot reference each other, hence the repeat.)
      DEPLOY_ENV: ${{ github.base_ref == 'production' && 'production' || 'staging' }}
      TF_VAR_active_environment: ${{ github.base_ref == 'production' && 'production' || 'staging' }}
      TF_VAR_image_tag: ${{ github.sha }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_DEFAULT_ZONE: ${{ vars.SCW_DEFAULT_ZONE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper rewrites stdout, which breaks the plan summary below.
          terraform_wrapper: false
      - name: Init & validate
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=${DEPLOY_ENV}/terraform.tfstate"
          terraform validate
      - name: Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -o pipefail
          terraform plan -no-color -var-file="terraform.tfvars" | tee plan.txt
      - name: Publish plan summary
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          # The plan may have died before writing anything; a missing file is
          # not worth a second, misleading failure on top of the real one.
          [ -f plan.txt ] || { echo "No plan output to summarize."; exit 0; }
          {
            echo "### Terraform plan — \`${DEPLOY_ENV}\`"
            echo
            echo '```terraform'
            # Step summaries cap at 1 MiB; keep the tail, which holds the
            # resource changes and the plan totals.
            tail -c 900000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    # The single required status check. `always()` so it still reports when an
    # upstream job was skipped by a path filter.
    if: always()
    needs:
      [
        changes,
        verify,
        commit-lint,
        ai-gates,
        build-backend,
        build-frontend,
        terraform-plan,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*)
              echo "::error::At least one CI job did not succeed."
              exit 1
              ;;
          esac
          echo "All CI jobs succeeded or were skipped."
