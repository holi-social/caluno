query GetOrganizationUnitMemberships {
  memberships {
    id
    user {
      id
      name
      email
      image
      checkInId
    }
    organizationUnit {
      id
      name
    }
    roles {
      id
      name
      description
      isInternal
    }
    idVerifiedAt
    idVerifiedBy {
      id
      name
    }
  }
}

query GetMyMembershipStatus($organizationUnitId: ID!) {
  myMembershipStatus(organizationUnitId: $organizationUnitId)
}

mutation UpdateMembershipRoles($membershipId: ID!, $roleIds: [ID!]!) {
  updateMembershipRoles(membershipId: $membershipId, roleIds: $roleIds) {
    id
    user {
      id
      name
      email
      image
      checkInId
    }
    organizationUnit {
      id
      name
    }
    roles {
      id
      name
      description
      isInternal
    }
  }
}

mutation LeaveMembership($id: ID!) {
  leaveMembership(id: $id) {
    id
  }
}

mutation RemoveMembership($id: ID!) {
  removeMembership(id: $id) {
    id
  }
}

query MyMemberships {
  myMemberships {
    id
    createdAt
    organizationUnit {
      id
      name
      logoUrl
      type {
        icon
      }
      parent {
        id
      }
      organization {
        name
      }
    }
    roles {
      id
      name
    }
  }
}

query MyMembership($id: ID!) {
  myMembership(id: $id) {
    id
    createdAt
    organizationUnit {
      id
      name
      logoUrl
      type {
        icon
      }
      parent {
        id
      }
      organization {
        name
      }
    }
    roles {
      id
      name
    }
  }
}

mutation SetMembershipIdVerified($membershipId: ID!, $verified: Boolean!) {
  setMembershipIdVerified(membershipId: $membershipId, verified: $verified) {
    id
    idVerifiedAt
  }
}

mutation CheckInSetMembershipIdVerified(
  $membershipId: ID!
  $verified: Boolean!
) {
  checkInSetMembershipIdVerified(
    membershipId: $membershipId
    verified: $verified
  ) {
    id
    idVerifiedAt
  }
}
