query GetOrganizationUnitMemberships {
  memberships {
    id
    user {
      id
      name
      email
      image
      checkInId
    }
    organizationUnit {
      id
      name
    }
    roles {
      id
      name
      description
      isInternal
    }
  }
}

query GetMyMemberships {
  myMemberships {
    id
    organizationUnit {
      id
      name
    }
  }
}

query GetMyMembershipStatus($organizationUnitId: ID!) {
  myMembershipStatus(organizationUnitId: $organizationUnitId)
}

mutation UpdateMembershipRoles($membershipId: ID!, $roleIds: [ID!]!) {
  updateMembershipRoles(membershipId: $membershipId, roleIds: $roleIds) {
    id
    user {
      id
      name
      email
      image
      checkInId
    }
    organizationUnit {
      id
      name
    }
    roles {
      id
      name
      description
      isInternal
    }
  }
}

mutation LeaveMembership($id: ID!) {
  leaveMembership(id: $id)
}

query MyMemberships {
  myMemberships {
    id
    createdAt
    organizationUnit {
      id
      name
      logoUrl
      type {
        icon
      }
      parent {
        id
      }
      organization {
        name
      }
    }
    roles {
      id
      name
    }
  }
}
