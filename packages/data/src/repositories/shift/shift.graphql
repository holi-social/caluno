query GetShift($id: String!) {
  shift(id: $id) {
    id
    title
    slug
    instructions
    location
    imageUrl
    visibility
    createdAt
    maxVolunteers
    minVolunteers
    rrule
    originalStartsAt
    durationMinutes
    organizationUnitId
    organizationUnit {
      id
      name
      logoUrl
    }
    createdBy {
      id
      name
      image
    }
    event {
      id
      title
      coverImageUrl
    }
  }
}

query GetShifts($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      rrule
      originalStartsAt
      durationMinutes
      visibility
      maxVolunteers
      minVolunteers
      createdBy {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
  }
}

mutation UpdateShift($id: String!, $input: UpdateShiftInput!) {
  updateShift(id: $id, input: $input) {
    id
  }
}

mutation DeleteShift($id: String!) {
  deleteShift(id: $id) {
    id
  }
}

mutation UpdateMembersForShiftInstance(
  $instanceId: String!
  $memberIds: [String!]!
  $inviteToAllInstances: Boolean
) {
  updateMembersForShiftInstance(
    instanceId: $instanceId
    memberIds: $memberIds
    inviteToAllInstances: $inviteToAllInstances
  ) {
    id
  }
}

mutation UpdateShiftInstanceVolunteers(
  $instanceId: String!
  $memberIds: [String!]!
) {
  updateMembersForShiftInstance(
    instanceId: $instanceId
    memberIds: $memberIds
  ) {
    id
  }
}

mutation JoinShiftInstance($instanceId: String!) {
  joinShiftInstance(instanceId: $instanceId) {
    status
    shiftInstance {
      id
      actualStartsAt
      actualEndsAt
      overrideTitle
      overrideInstructions
      overrideLocation
      overrideMaxVolunteers
      isException
      isCancelled
      occurrenceIndex
      myJoinStatus
      master {
        id
        title
      }
    }
    membershipRequestId
    requirementProfile {
      id
      name
      description
      requirements {
        id
        name
        description
        type
        mandatory
      }
    }
    requirementStatuses {
      requirementId
      name
      status
    }
    requiredForms {
      form {
        id
        name
        description
      }
      order
      submitted
      submissionId
    }
  }
}

query GetShiftVolunteers($instanceId: ID!) {
  shiftVolunteers(instanceId: $instanceId) {
    id
    name
    email
    image
  }
}

query GetActiveShiftInstances($userId: String!) {
  activeShiftInstances {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    invites(userId: $userId) {
      status
    }
    master {
      id
      title
      location
      instructions
      visibility
      maxVolunteers
    }
  }
}

query GetShiftInstances($shiftId: ID!) {
  shiftInstances(shiftId: $shiftId) {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    isCancelled
  }
}

query GetWeeklyShifts($from: DateTime!, $to: DateTime!) {
  weeklyShifts(from: $from, to: $to) {
    id
    actualStartsAt
    actualEndsAt
    isCancelled
    master {
      id
      title
      minVolunteers
      maxVolunteers
      visibility
    }
    volunteers {
      id
      name
    }
  }
}

fragment PublicShiftDetailInstanceFields on ShiftInstance {
  id
  actualStartsAt
  actualEndsAt
  overrideTitle
  overrideMaxVolunteers
  filledCount
  spotsLeft
  myJoinStatus
}

query GetPublicShiftInstances($shiftId: ID!) {
  publicShiftInstances(shiftId: $shiftId) {
    ...PublicShiftDetailInstanceFields
  }
}

fragment VolunteerHomeShiftInstance on ShiftInstance {
  id
  actualStartsAt
  actualEndsAt
  isCheckedIn
  filledCount
  master {
    id
    title
    location
    rrule
    maxVolunteers
    organizationUnit {
      id
      name
    }
    event {
      id
      title
      coverImageUrl
    }
  }
}

query GetMyShiftInstances($includePast: Boolean = false) {
  myShiftInstances(includePast: $includePast) {
    ...VolunteerHomeShiftInstance
  }
}

query GetAvailableShiftInstances(
  $from: DateTime
  $to: DateTime
  $organizationUnitIds: [ID!]
) {
  availableShiftInstances(
    from: $from
    to: $to
    organizationUnitIds: $organizationUnitIds
  ) {
    ...VolunteerHomeShiftInstance
  }
}

mutation CheckIn($shiftInstanceId: ID!) {
  checkIn(shiftInstanceId: $shiftInstanceId) {
    id
  }
}

mutation CheckOut($shiftInstanceId: ID!) {
  checkOut(shiftInstanceId: $shiftInstanceId) {
    id
  }
}
