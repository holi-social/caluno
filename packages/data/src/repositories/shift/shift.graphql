query GetShift($id: String!) {
  shift(id: $id) {
    id
    title
    slug
    instructions
    location
    startsAt
    endsAt
    visibility
    project {
      id
      title
    }
    volunteers {
      id
      name
      email
      image
    }
    createdBy {
      id
      name
      email
      image
    }
  }
}

query GetShifts($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      startsAt
      endsAt
      visibility
      project {
        id
        title
      }
      volunteers {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftsByProjectId($projectId: String!, $limit: Int!, $offset: Int!) {
  shiftsByProjectId(projectId: $projectId, limit: $limit, offset: $offset) {
    items {
      id
      title
      instructions
      startsAt
      endsAt
      createdBy {
        id
        name
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftsForTimeEntryCreation($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      volunteers {
        id
        name
        email
      }
    }
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
  }
}

mutation UpdateShift($id: String!, $input: UpdateShiftInput!) {
  updateShift(id: $id, input: $input) {
    id
  }
}

mutation DeleteShift($id: String!) {
  deleteShift(id: $id) {
    id
  }
}

query GetActiveShifts($limit: Int!, $offset: Int!) {
  activeShifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      startsAt
      endsAt
      project {
        id
        title
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}
