query GetShift($id: String!) {
  shift(id: $id) {
    id
    title
    slug
    instructions
    location
    visibility
    createdAt
    maxVolunteers
    rrule
    originalStartsAt
    durationMinutes
    organizationUnitId
    createdBy {
      id
      name
      email
      image
    }
  }
}

query GetShifts($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      rrule
      originalStartsAt
      durationMinutes
      visibility
      maxVolunteers
      createdBy {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftsForTimeEntryCreation($limit: Int!, $offset: Int!) {
  activeShifts(limit: $limit, offset: $offset) {
    items {
      id
      actualStartsAt
      actualEndsAt
      master {
        id
        title
      }
      volunteers {
        id
        name
        email
      }
    }
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
  }
}

mutation UpdateShift($id: String!, $input: UpdateShiftInput!) {
  updateShift(id: $id, input: $input) {
    id
  }
}

mutation DeleteShift($id: String!) {
  deleteShift(id: $id) {
    id
  }
}

mutation InviteShiftVolunteers($shiftId: String!, $memberIds: [String!]!) {
  inviteMembersToShift(shiftId: $shiftId, memberIds: $memberIds) {
    id
  }
}

query GetActiveShifts($limit: Int!, $offset: Int!) {
  activeShifts(limit: $limit, offset: $offset) {
    items {
      id
      actualStartsAt
      actualEndsAt
      master {
        id
        title
        location
        instructions
        visibility
        maxVolunteers
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}
