query GetShift($id: String!) {
  shift(id: $id) {
    id
    title
    slug
    instructions
    location
    visibility
    createdAt
    maxVolunteers
    minVolunteers
    rrule
    originalStartsAt
    durationMinutes
    organizationUnitId
    createdBy {
      id
      name
      image
    }
  }
}

query GetShifts($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      rrule
      originalStartsAt
      durationMinutes
      visibility
      maxVolunteers
      minVolunteers
      createdBy {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftsForTimeEntryCreation($limit: Int!, $offset: Int!) {
  activeShifts(limit: $limit, offset: $offset) {
    items {
      id
      actualStartsAt
      actualEndsAt
      master {
        id
        title
      }
      volunteers {
        id
        name
        email
      }
    }
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
  }
}

mutation UpdateShift($id: String!, $input: UpdateShiftInput!) {
  updateShift(id: $id, input: $input) {
    id
  }
}

mutation DeleteShift($id: String!) {
  deleteShift(id: $id) {
    id
  }
}

mutation InviteShiftInstanceVolunteers(
  $instanceId: String!
  $memberIds: [String!]!
) {
  inviteMembersToShiftInstance(instanceId: $instanceId, memberIds: $memberIds) {
    id
  }
}

mutation JoinShiftInstance($instanceId: String!) {
  joinShiftInstance(instanceId: $instanceId) {
    status
    shift {
      id
      title
      slug
      instructions
      location
      visibility
      createdAt
      maxVolunteers
      rrule
      originalStartsAt
      durationMinutes
      organizationUnitId
      createdBy {
        id
        name
        email
        image
      }
    }
    membershipRequestId
    requirementProfile {
      id
      name
      description
      requirements {
        id
        name
        description
        type
        mandatory
      }
    }
    requirementStatuses {
      requirementId
      name
      status
    }
  }
}

query GetShiftVolunteers($instanceId: ID!) {
  shiftVolunteers(instanceId: $instanceId) {
    id
    name
    email
    image
  }
}

query GetActiveShifts($limit: Int!, $offset: Int!) {
  activeShifts(limit: $limit, offset: $offset) {
    items {
      id
      actualStartsAt
      actualEndsAt
      master {
        id
        title
        location
        instructions
        visibility
        maxVolunteers
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftInstances($shiftId: ID!) {
  shiftInstances(shiftId: $shiftId) {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    isCancelled
  }
}

query GetWeeklyShifts($from: DateTime!, $to: DateTime!) {
  weeklyShifts(from: $from, to: $to) {
    id
    actualStartsAt
    actualEndsAt
    isCancelled
    master {
      id
      title
      minVolunteers
      maxVolunteers
      visibility
    }
    volunteers {
      id
      name
    }
  }
}
