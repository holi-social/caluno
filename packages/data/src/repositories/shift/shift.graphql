query GetShift($id: String!) {
  shift(id: $id) {
    id
    title
    slug
    instructions
    location
    imageUrl
    visibility
    createdAt
    maxVolunteers
    minVolunteers
    rrule
    originalStartsAt
    durationMinutes
    organizationUnitId
    requiredFormsCount
    requiredForms {
      ...RequiredFormRefFields
    }
    organizationUnit {
      id
      name
      logoUrl
      myMembershipState
      organization {
        id
        name
      }
    }
    createdBy {
      id
      name
      image
    }
    event {
      id
      title
      coverImageUrl
    }
  }
}

query GetShifts($limit: Int!, $offset: Int!) {
  shifts(limit: $limit, offset: $offset) {
    items {
      id
      title
      rrule
      originalStartsAt
      durationMinutes
      visibility
      maxVolunteers
      minVolunteers
      requiredFormsCount
      createdBy {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetEventShifts($eventId: ID!, $limit: Int!, $offset: Int!) {
  eventShifts(eventId: $eventId, limit: $limit, offset: $offset) {
    items {
      id
      title
      rrule
      originalStartsAt
      durationMinutes
      visibility
      maxVolunteers
      minVolunteers
      requiredFormsCount
      createdBy {
        id
        name
        email
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetShiftInstancesByMasterIds($masterIds: [ID!]!) {
  shiftInstancesByMasterIds(masterIds: $masterIds) {
    masterId
    instances {
      id
      masterId
    }
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
  }
}

mutation UpdateShift($id: String!, $input: UpdateShiftInput!) {
  updateShift(id: $id, input: $input) {
    id
  }
}

mutation DeleteShift($id: String!) {
  deleteShift(id: $id) {
    id
  }
}

mutation SetShiftRequiredForms($shiftId: ID!, $formIds: [String!]!) {
  setShiftRequiredForms(shiftId: $shiftId, formIds: $formIds) {
    ...RequiredFormRefFields
  }
}

mutation UpdateMembersForShiftInstance(
  $instanceId: String!
  $memberIds: [String!]!
  $inviteToAllInstances: Boolean
) {
  updateMembersForShiftInstance(
    instanceId: $instanceId
    memberIds: $memberIds
    inviteToAllInstances: $inviteToAllInstances
  ) {
    id
  }
}

mutation UpdateShiftInstance(
  $instanceId: String!
  $input: UpdateShiftInstanceInput!
  $applyToAllFuture: Boolean
) {
  updateShiftInstance(
    instanceId: $instanceId
    input: $input
    applyToAllFuture: $applyToAllFuture
  ) {
    id
  }
}

mutation UpdateShiftInstanceVolunteers(
  $instanceId: String!
  $memberIds: [String!]!
) {
  updateMembersForShiftInstance(
    instanceId: $instanceId
    memberIds: $memberIds
  ) {
    id
  }
}

mutation UpdateShiftInstanceInviteStatus(
  $instanceId: String!
  $status: ShiftInviteStatus!
  $userId: String
) {
  updateShiftInstanceInviteStatus(
    instanceId: $instanceId
    status: $status
    userId: $userId
  ) {
    status
    userId
  }
}

mutation JoinShiftInstance($instanceId: String!) {
  joinShiftInstance(instanceId: $instanceId) {
    status
    shiftInstance {
      id
      actualStartsAt
      actualEndsAt
      overrideTitle
      overrideInstructions
      overrideLocation
      overrideMaxVolunteers
      isException
      isCancelled
      occurrenceIndex
      master {
        id
        title
      }
    }
    membershipRequestId
    requirementProfile {
      id
      name
      description
      requirements {
        id
        name
        description
        type
        mandatory
      }
    }
    requirementStatuses {
      requirementId
      name
      status
    }
    requiredForms {
      ...RequiredFormWithStatusFields
    }
  }
}

query GetShiftVolunteers($instanceId: ID!, $statuses: [ShiftInviteStatus!]) {
  shiftVolunteers(instanceId: $instanceId, statuses: $statuses) {
    id
    name
    email
    image
  }
}

query GetActiveShiftInstances($userId: String!) {
  activeShiftInstances {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    invite(userId: $userId) {
      status
    }
    master {
      id
      title
      location
      instructions
      visibility
      maxVolunteers
    }
  }
}

query GetShiftInstances($shiftId: ID!) {
  shiftInstances(shiftId: $shiftId) {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    isCancelled
  }
}

query GetShiftInstance($id: ID!) {
  shiftInstance(id: $id) {
    id
    actualStartsAt
    actualEndsAt
    overrideTitle
    overrideLocation
    overrideInstructions
    overrideMaxVolunteers
    overrideMinVolunteers
    isCancelled
    filledCount
    spotsLeft
    master {
      id
      title
      location
      instructions
      minVolunteers
      maxVolunteers
      visibility
    }
    invites {
      status
      user {
        id
        name
        email
        image
        checkInId
      }
    }
  }
}

query GetWeeklyShifts($from: DateTime!, $to: DateTime!) {
  weeklyShifts(from: $from, to: $to) {
    id
    overrideTitle
    actualStartsAt
    actualEndsAt
    isCancelled
    overrideMinVolunteers
    overrideMaxVolunteers
    master {
      id
      title
      minVolunteers
      maxVolunteers
      visibility
    }
    volunteers {
      id
      name
    }
    invites {
      status
      user {
        id
        name
        email
        image
      }
    }
  }
}

fragment PublicShiftDetailInstanceFields on ShiftInstance {
  id
  actualStartsAt
  actualEndsAt
  overrideTitle
  overrideMaxVolunteers
  filledCount
  spotsLeft
  myInviteStatus
  isIntendingToJoin
}

query GetPublicShiftInstances($shiftId: ID!) {
  publicShiftInstances(shiftId: $shiftId) {
    ...PublicShiftDetailInstanceFields
  }
}

fragment VolunteerHomeShiftInstance on ShiftInstance {
  id
  overrideTitle
  actualStartsAt
  actualEndsAt
  isCheckedIn
  filledCount
  myInviteStatus
  isIntendingToJoin
  master {
    id
    title
    location
    rrule
    maxVolunteers
    organizationUnit {
      id
      name
    }
    event {
      id
      title
      coverImageUrl
    }
  }
}

query GetMyShiftInstances(
  $includePast: Boolean = false
  $startsAfter: DateTime
  $endsBefore: DateTime
  $limit: Int = 15
  $offset: Int = 0
  $order: SortOrder = ASC
  $statuses: [ShiftInviteStatus!]
  $includeIntended: Boolean = false
) {
  myShiftInstances(
    includePast: $includePast
    startsAfter: $startsAfter
    endsBefore: $endsBefore
    limit: $limit
    offset: $offset
    order: $order
    statuses: $statuses
    includeIntended: $includeIntended
  ) {
    items {
      ...VolunteerHomeShiftInstance
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetAvailableShiftInstances(
  $startsAfter: DateTime
  $endsBefore: DateTime
  $organizationUnitIds: [ID!]
  $limit: Int = 15
  $offset: Int = 0
) {
  availableShiftInstances(
    startsAfter: $startsAfter
    endsBefore: $endsBefore
    organizationUnitIds: $organizationUnitIds
    limit: $limit
    offset: $offset
  ) {
    items {
      ...VolunteerHomeShiftInstance
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

mutation CheckIn($shiftInstanceId: ID!) {
  checkIn(shiftInstanceId: $shiftInstanceId) {
    id
  }
}

mutation CheckOut($shiftInstanceId: ID!) {
  checkOut(shiftInstanceId: $shiftInstanceId) {
    id
  }
}
