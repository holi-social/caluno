mutation AddTimeEntry($input: AddTimeEntryInput!) {
  addTimeEntry(input: $input) {
    id
  }
}

mutation DeleteTimeEntry($id: ID!) {
  deleteTimeEntry(id: $id) {
    id
  }
}

query GetTimeEntries($limit: Int!, $offset: Int!) {
  timeEntries(limit: $limit, offset: $offset) {
    items {
      id
      startedAt
      endedAt
      volunteer {
        id
        name
        email
      }
      shift {
        title
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}
