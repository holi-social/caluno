mutation CreateMembershipRequest($organizationId: ID!) {
  createMembershipRequest(organizationId: $organizationId) {
    id
  }
}

mutation ApproveMembershipRequest($id: ID!, $organizationId: ID!) {
  approveMembershipRequest(id: $id, organizationId: $organizationId) {
    id
  }
}

mutation RejectMembershipRequest(
  $id: ID!
  $organizationId: ID!
  $rejectionReason: String!
) {
  rejectMembershipRequest(
    id: $id
    organizationId: $organizationId
    rejectionReason: $rejectionReason
  ) {
    id
  }
}

mutation CancelMembershipRequest($id: ID!, $organizationId: ID!) {
  cancelMembershipRequest(id: $id, organizationId: $organizationId) {
    id
  }
}

query GetMembershipRequests(
  $organizationId: ID!
  $status: MembershipRequestStatus
  $limit: Int!
  $offset: Int!
) {
  membershipRequests(
    organizationId: $organizationId
    status: $status
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      organization {
        id
        name
      }
      user {
        id
        name
        email
      }
      status
      reviewedBy {
        id
        name
      }
      reviewedAt
      rejectionReason
      createdAt
      updatedAt
    }
  }
}
