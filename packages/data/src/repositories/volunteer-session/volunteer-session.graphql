query GetVolunteerSessions($status: VolunteerSessionStatus) {
  volunteerSessions(status: $status) {
    id
    status
    createdAt
    validatedAt
    rejectionReason
    user {
      id
      name
      email
    }
    task {
      id
      title
      project {
        id
        title
      }
    }
    shift {
      id
      title
      startsAt
      endsAt
    }
    entries {
      id
      startedAt
      endedAt
      notes
    }
    validatedBy {
      id
      name
      email
    }
  }
}

mutation ApproveVolunteerSession($input: ApproveVolunteerSessionInput!) {
  approveVolunteerSession(input: $input) {
    id
    status
    validatedAt
    validatedBy {
      id
      name
      email
    }
  }
}

mutation RejectVolunteerSession($input: RejectVolunteerSessionInput!) {
  rejectVolunteerSession(input: $input) {
    id
    status
    validatedAt
    validatedBy {
      id
      name
      email
    }
    rejectionReason
  }
}

mutation StartVolunteerSession($input: StartVolunteerSessionInput!) {
  startVolunteerSession(input: $input) {
    id
    status
    createdAt
  }
}
