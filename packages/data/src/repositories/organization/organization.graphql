query GetOrganization($id: String!) {
  organization(id: $id) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    contactEmail
    phone
    address
    createdAt
    updatedAt
  }
}

query GetOrganizationBySlug($slug: String!) {
  organizationBySlug(slug: $slug) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    contactEmail
    phone
    address
    createdAt
  }
}

query GetOrganizationRoot($id: String!) {
  organization(id: $id) {
    id
    root {
      id
    }
  }
}

query GetOrganizationUnit($id: String!) {
  organizationUnit(id: $id) {
    id
    slug
    name
    description
    logoUrl
    websiteUrl
    contactEmail
    phone
    address
    organizationId
    parent {
      id
      name
    }
    type {
      id
      name
      icon
    }
  }
}

query GetOrganizationVolunteersByUnit($id: ID!) {
  members(organizationUnitId: $id) {
    id
    name
    email
    image
    checkInId
  }
}

query GetOrganizationUnitWithOrg($id: String!) {
  organizationUnit(id: $id) {
    id
    name
    organization {
      name
    }
  }
}

query GetOrganizationUnitPublicInfo($id: String!) {
  organizationUnit(id: $id) {
    id
    name
    description
    logoUrl
    websiteUrl
    contactEmail
    phone
  }
}

query GetOrganizationsWithRoot($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      description
      logoUrl
      root {
        id
        slug
        name
        description
        logoUrl
        address
      }
    }
  }
}

query GetMyAccessibleOrganizationUnits {
  myAccessibleOrganizationUnits {
    id
    slug
    name
    description
    logoUrl
    address
    parent {
      id
    }
    organization {
      id
      name
      description
      logoUrl
    }
  }
}

query GetOrganizations($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      slug
      description
      logoUrl
      createdAt
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

mutation CreateOrganization($input: CreateOrganizationInput!) {
  createOrganization(input: $input) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    createdAt
    root {
      id
    }
  }
}

query GetOrganizationTree {
  organizationTree {
    root
  }
}

query GetOrganizationUnitTypes {
  organizationUnitTypes {
    id
    name
    description
    icon
  }
}

mutation CreateOrganizationUnit($input: CreateOrganizationUnitInput!) {
  createOrganizationUnit(input: $input) {
    id
    name
    slug
    deletedAt
    parent {
      id
      name
    }
    type {
      id
      name
      icon
    }
  }
}

mutation UpdateOrganizationUnit(
  $id: String!
  $input: UpdateOrganizationUnitInput!
) {
  updateOrganizationUnit(id: $id, input: $input) {
    id
    name
    slug
    deletedAt
    parent {
      id
    }
    type {
      id
      name
      icon
    }
  }
}

mutation DeleteOrganizationUnit($id: String!) {
  deleteOrganizationUnit(id: $id) {
    id
    name
  }
}

query IsMemberOfOrgUnitOrAncestor($organizationUnitId: ID!, $userId: String!) {
  isMemberOfUnitOrAncestor(
    organizationUnitId: $organizationUnitId
    userId: $userId
  )
}
