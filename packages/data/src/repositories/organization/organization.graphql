query GetOrganization($id: String!) {
  organization(id: $id) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    email
    phone
    address
    createdAt
    updatedAt
  }
}

query GetOrganizationPublicInfo($id: String!) {
  organizationPublicInfo(id: $id) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    email
    phone
    address
  }
}

query GetVolunteers($id: String!) {
  organization(id: $id) {
    id
    volunteers {
      id
      name
      email
      image
      checkInId
    }
  }
}

query GetOrganizations($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      slug
      description
      logoUrl
      createdAt
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetOrganizationBySlug($slug: String!) {
  organizationBySlug(slug: $slug) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    email
    phone
    address
    createdAt
  }
}

mutation CreateOrganization($input: CreateOrganizationInput!) {
  createOrganization(input: $input) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    createdAt
  }
}
