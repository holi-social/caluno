query GetOrganization($id: String!) {
  organization(id: $id) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    email
    phone
    address
    createdAt
    updatedAt
  }
}

query GetVolunteers($id: String!) {
  organization(id: $id) {
    id
    volunteers {
      id
      name
      email
      image
      checkInId
    }
  }
}

query GetOrganizationRoot($id: String!) {
  organization(id: $id) {
    id
    root {
      id
    }
  }
}

query GetOrganizationVolunteersByUnit($id: String!) {
  organizationUnit(id: $id) {
    organization {
      id
      volunteers {
        id
        name
        email
        image
        checkInId
      }
    }
  }
}

query GetOrganizationUnitWithOrg($id: String!) {
  organizationUnit(id: $id) {
    id
    name
    organization {
      name
    }
  }
}

query GetOrganizationsWithRoot($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      description
      logoUrl
      root {
        id
        slug
        name
        description
        logoUrl
        address
      }
    }
  }
}

query GetOrganizations($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      slug
      description
      logoUrl
      createdAt
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetOrganizationBySlug($slug: String!) {
  organizationBySlug(slug: $slug) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    email
    phone
    address
    createdAt
  }
}

mutation CreateOrganization($input: CreateOrganizationInput!) {
  createOrganization(input: $input) {
    id
    name
    slug
    description
    logoUrl
    websiteUrl
    createdAt
  }
}
