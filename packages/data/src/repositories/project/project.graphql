mutation CreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    title
    description
    location
    startsAt
    endsAt
    status
  }
}

mutation UpdateProject($id: ID!, $input: UpdateProjectInput!) {
  updateProject(id: $id, input: $input) {
    id
    title
    slug
    description
    location
    startsAt
    endsAt
    status
    createdBy {
      id
      name
    }
    createdAt
    updatedAt
  }
}

query GetProject($id: ID!) {
  project(id: $id) {
    id
    title
    slug
    description
    location
    startsAt
    endsAt
    status
    createdBy {
      id
      name
    }
    createdAt
    updatedAt
  }
}

query GetProjects($organizationId: ID!, $limit: Int!, $offset: Int!) {
  projects(organizationId: $organizationId, limit: $limit, offset: $offset) {
    items {
      id
      title
      slug
      description
      location
      startsAt
      endsAt
      status
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}
