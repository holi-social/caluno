query GetMe {
  me {
    id
    name
    email
    image
  }
}

query GetUser($id: String!) {
  user(id: $id) {
    id
    name
    email
    image
  }
}

query GetMyOrganizations($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      slug
      description
      logoUrl
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}
