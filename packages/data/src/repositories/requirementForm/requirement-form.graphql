query GetAdminFormSubmission($id: String!) {
  adminVolunteerSubmission(id: $id) {
    id
    submittedAt
    user {
      id
      name
      email
      checkInId
    }
    form {
      id
      name
      blockRefs {
        fieldOrder
        block {
          id
          fields {
            id
            label
            type
            systemKey
            options {
              label
              value
            }
          }
        }
      }
    }
    values {
      fieldId
      value
    }
  }
}

