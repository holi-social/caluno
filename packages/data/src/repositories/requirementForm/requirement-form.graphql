query GetFormBlock($id: String!) {
  formBlock(id: $id) {
    id
    organizationId
    title
    description
    icon
    required
    isEditable
    createdBy
    updatedBy
    createdAt
    updatedAt
    fields {
      id
      blockId
      type
      label
      placeholder
      description
      required
      lockType
      systemKey
      options {
        label
        value
      }
      documentUrl
      documentLabel
      minAge
      fieldOrder
      createdAt
      updatedAt
    }
  }
}

query GetFormBlocks($organizationId: String!, $limit: Int!, $offset: Int!) {
  formBlocks(organizationId: $organizationId, limit: $limit, offset: $offset) {
    items {
      id
      organizationId
      title
      description
      icon
      required
      isEditable
      createdBy
      updatedBy
      createdAt
      updatedAt
      fields {
        id
        blockId
        type
        label
        placeholder
        description
        required
        lockType
        systemKey
        options {
          label
          value
        }
        documentUrl
        documentLabel
        minAge
        fieldOrder
        createdAt
        updatedAt
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

