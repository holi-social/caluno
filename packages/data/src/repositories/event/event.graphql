fragment EventListFields on Event {
  id
  title
  slug
  startsAt
  endsAt
  location
  shiftsCount
  requiredFormsCount
}

fragment RequiredFormFields on RequirementForm {
  id
  name
  description
  settings {
    submitButtonLabel
    successTitle
    successMessage
  }
  blockRefs {
    id
    formId
    blockId
    fieldOrder
    required
    block {
      id
      organizationId
      title
      description
      icon
      required
      isEditable
      fields {
        id
        blockId
        type
        label
        placeholder
        description
        required
        lockType
        systemKey
        options {
          label
          value
        }
        documentFileId
        documentDownloadUrl
        documentFilename
        documentLabel
        minAge
        fieldOrder
      }
    }
  }
}

fragment RequiredFormRefFields on RequiredFormRef {
  form {
    ...RequiredFormFields
  }
  order
}

fragment RequiredFormWithStatusFields on RequiredFormWithStatus {
  form {
    ...RequiredFormFields
  }
  order
  submitted
  submissionId
  targetType
  targetId
}

fragment EventDetailFields on Event {
  ...EventListFields
  organizer {
    id
    name
    image
  }
  coverUrl
  logoUrl
  requiredForms {
    ...RequiredFormRefFields
  }
}

query GetEvents($limit: Int!, $offset: Int!) {
  events(limit: $limit, offset: $offset) {
    items {
      ...EventListFields
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetEvent($id: ID!) {
  event(id: $id) {
    ...EventDetailFields
  }
}

query GetEventAttendees($eventId: ID!) {
  eventAttendees(eventId: $eventId) {
    id
    name
    email
    image
    checkInId
  }
}

mutation CreateEvent($input: CreateEventInput!) {
  createEvent(input: $input) {
    ...EventDetailFields
  }
}

mutation UpdateEvent($id: ID!, $input: UpdateEventInput!) {
  updateEvent(id: $id, input: $input) {
    ...EventDetailFields
  }
}

mutation DeleteEvent($id: ID!) {
  deleteEvent(id: $id) {
    id
  }
}

mutation InviteMembersToEvent($eventId: ID!, $memberIds: [String!]!) {
  inviteMembersToEvent(eventId: $eventId, memberIds: $memberIds) {
    id
  }
}

fragment PublicEventOrganizationUnitFields on EventOrganizationUnit {
  id
  name
  slug
  logoUrl
}

fragment PublicShiftInstanceFields on ShiftInstance {
  id
  actualStartsAt
  actualEndsAt
  overrideTitle
  overrideMaxVolunteers
  filledCount
  spotsLeft
}

fragment PublicShiftFields on Shift {
  id
  title
  maxVolunteers
  instances {
    ...PublicShiftInstanceFields
  }
}

fragment PublicEventFields on Event {
  id
  title
  slug
  description
  location
  coverImageUrl
  startsAt
  endsAt
  shiftsCount
  myJoinStatus
  organizationUnit {
    ...PublicEventOrganizationUnitFields
  }
  shifts {
    ...PublicShiftFields
  }
  requiredForms {
    ...RequiredFormRefFields
  }
}

query GetPublicEvent($id: ID!) {
  publicEvent(id: $id) {
    ...PublicEventFields
  }
}

mutation JoinEvent($eventId: ID!) {
  joinEvent(eventId: $eventId) {
    status
    event {
      id
    }
    requiredForms {
      ...RequiredFormWithStatusFields
    }
  }
}

mutation SetEventRequiredForms($eventId: ID!, $formIds: [String!]!) {
  setEventRequiredForms(eventId: $eventId, formIds: $formIds) {
    ...RequiredFormRefFields
  }
}
